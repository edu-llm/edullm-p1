# Source of truth: ../olmo_core_token_selection/token_selection_370m/arms.py ARM_SPECS["blade"]
#   and ../olmo_core_token_selection/token_selection_370m/blade.py (BLADE_SYNC_STEPS, BLADE_TAU, BLADE_K)
# Method fix vs. the confounded run: the reference's own training term is now
# selection-weighted (Wang et al. 2026, Sec. 2.2), scored against the outgoing
# reference before it is overwritten by the sync. The schedule starts at step 0
# (previously step 500), so BLADE selects at the same 60% budget as every other arm
# from step 0 rather than running full-loss through step 500.
name: blade
method: blade  # top 60% by L_proxy - L_ref, selection-weighted reference update
dataset_id: pretrain/regmix-10b
run_id: blade-regmix10b
keep_fraction: 0.6
init_seed: 6198
data_seed: 42
# 16Ki (the default every other arm uses) OOMs a 44 GiB L40S here: BLADE
# holds the proxy, the dynamic reference, and both optimizers resident at
# once during its K-update sync. Confirmed by a FarmShare smoke test.
rank_microbatch_tokens: 8192
max_tokens: 9900000000
total_steps: 2360
checkpoint_ladder: [0, 125, 250, 375, 500, 625, 750, 875, 1000, 1125, 1250, 1375, 1500, 1625, 1750, 1875, 2000, 2125, 2360]  # omit 2250
requires_refhq_stream: true
second_stream: pretrain/refhq-instruct  # L_val stream, and the reference's own train batches
schedule:
  sync_steps: [0, 400, 800, 1200, 1600, 2000]
  tau: 400
  k_steps: 75
  gamma: 0.6  # keep fraction, matches keep_fraction
  lambda: 1.0
reference: dynamic  # reset from the proxy at every sync step; see blade.py
olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  branch: edullm/token-selection-370m-unified
  revision: 765ae838
wandb_project: token-selection
status: rerun-under-unified-commit
